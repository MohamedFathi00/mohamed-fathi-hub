<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin</title>
<style>body{margin:0;background:#050515;color:#fff;font:600 15px/1.6 Cairo,Tahoma,system-ui,sans-serif;padding:20px}.w{max-width:720px;margin:0 auto}h1{font-size:20px}input{width:100%;padding:12px;border-radius:12px;border:1px solid #8b5cf666;background:#ffffff0d;color:#fff;font:inherit;margin:8px 0}button{padding:10px 18px;border:0;border-radius:24px;font:700 14px inherit;color:#fff;cursor:pointer;background:linear-gradient(135deg,#7c3aed,#4f46e5);margin-inline-end:8px}button.r{background:#7f1d3a}.c{background:#0e0c33;border:1px solid #8b5cf666;border-radius:18px;padding:16px;margin:12px 0;display:flex;gap:14px;align-items:flex-start}.c img,.c .av{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#3b2a8a;flex:none}.m{color:#a99bd6;font-size:13px}#err{color:#ff8da1}h2{font-size:16px;margin-top:28px;color:#c4c0ee}</style></head><body><div class="w"><h1>إدارة آراء العملاء</h1>
<div id="lg"><input id="k" type="password" placeholder="كلمة السر" autocomplete="current-password"><button id="go" type="button">دخول</button><div id="err"></div></div>
<div id="ad" hidden><h2>بانتظار الموافقة</h2><div id="p"></div><h2>المنشورة</h2><div id="a"></div></div></div>
<script>
var key="";function $(i){return document.getElementById(i)}
function call(o){o.key=key;return fetch("/api/t?a=admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)}).then(function(r){return r.json().then(function(j){j._s=r.status;return j})})}
function card(it,pend){var d=document.createElement("div");d.className="c";var av;if(it.photo){av=document.createElement("img");av.src=it.photo;av.alt=""}else{av=document.createElement("div");av.className="av"}d.appendChild(av);var b=document.createElement("div");b.style.flex="1";var n=document.createElement("div");n.textContent=it.name+(it.role?" - "+it.role:"");var t=document.createElement("div");t.textContent=it.text;var m=document.createElement("div");m.className="m";m.textContent=new Date(it.ts).toLocaleString();b.appendChild(n);b.appendChild(t);b.appendChild(m);var bt=document.createElement("div");if(pend){var ok=document.createElement("button");ok.textContent="موافقة";ok.onclick=function(){act(it.id,"approve")};bt.appendChild(ok)}var no=document.createElement("button");no.className="r";no.textContent=pend?"رفض":"حذف";no.onclick=function(){act(it.id,pend?"reject":"delete")};bt.appendChild(no);b.appendChild(bt);d.appendChild(b);return d}
function show(j){$("lg").hidden=true;$("ad").hidden=false;var p=$("p"),a=$("a");p.textContent="";a.textContent="";if(!j.pending.length)p.textContent="لا يوجد شيء بانتظار الموافقة.";j.pending.forEach(function(x){p.appendChild(card(x,1))});if(!j.approved.length)a.textContent="لا يوجد شيء منشور.";j.approved.forEach(function(x){a.appendChild(card(x,0))})}
function act(id,x){call({act:x,id:id}).then(function(){return call({act:"list"})}).then(show)}
$("go").onclick=function(){key=$("k").value;$("err").textContent="";call({act:"list"}).then(function(j){if(j._s===200)show(j);else $("err").textContent=j._s===401?"كلمة السر غير صحيحة":"غير متاح الآن ("+j.error+")"})};
$("k").addEventListener("keydown",function(e){if(e.key==="Enter")$("go").click()})
</script></body></html>
