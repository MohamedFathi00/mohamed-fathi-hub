<style>*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth;background:#050515}body{background:#050515}
.wrap{max-width:1200px;margin:0 auto}section{position:relative;line-height:0}section img{width:100%;height:auto;display:block}
.hs{position:absolute;display:block;border-radius:14px;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}.hs:hover{background:rgba(167,139,250,.10)}.hs:focus-visible{outline:2px solid #a78bfa;outline-offset:1px}
.ring{position:absolute;border:2px solid #a78bfa;border-radius:18px;box-shadow:0 0 18px #8b5cf6;opacity:0;pointer-events:none;transition:opacity .25s}.ring.on{opacity:1}
body.light section img{filter:invert(1) hue-rotate(180deg) saturate(1.1)}body.light,body.light html,html.light{background:#eee9ff}

#stats{container-type:inline-size}.st{position:absolute;top:30%;width:12%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-family:Cairo,Tahoma,system-ui,sans-serif;line-height:1.2;color:#fff}
.rg{position:relative;width:62%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}.rg svg{position:absolute;inset:0;width:100%;height:100%}.rg b{position:relative;font-weight:800;font-size:3.1cqw}

body.light .st{color:#1c1240}body.light .se{color:#5d4d94}body.light .rg b{color:#1c1240}

.pc .tx{position:absolute;right:1.4cqw;left:6.4cqw;bottom:1.2cqw;text-align:right}.pc b{display:block;font-size:1.3cqw;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc small{display:block;font-size:1.2cqw;color:#b9a9ee}
.pc i{position:absolute;left:1.2cqw;bottom:1.2cqw;width:4.4cqw;height:4.4cqw;border-radius:50%;border:1px solid #8b5cf6;background:rgba(40,20,110,.7);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:2cqw}
.pc:hover,.pc:focus-visible{border-color:#c4b0ff;box-shadow:0 0 2.2cqw rgba(139,92,255,.6);outline:none}.pc.soon{cursor:default;opacity:.92}
.pd{position:absolute;left:0;right:0;top:89.5%;display:flex;justify-content:center;gap:1.1cqw;line-height:0}.pd button{width:1.1cqw;height:1.1cqw;border-radius:99px;border:0;background:#4b3c8c;cursor:pointer;padding:0;transition:.25s}.pd button.on{width:2.6cqw;background:#a855f7}
.car{z-index:4;background:rgba(10,6,40,.88);border:1px solid #8b5cf6!important;border-radius:50%!important;box-shadow:0 0 12px rgba(139,92,255,.5)}.car::before{content:"";position:absolute;top:50%;left:50%;width:26%;height:26%;border:solid #fff;border-width:0 2px 2px 0;transform:translate(-30%,-50%) rotate(135deg)}#pNext::before{transform:translate(-70%,-50%) rotate(-45deg)}.car{aspect-ratio:1;height:auto!important}.car[hidden]{display:none}
.car[disabled]{opacity:.35;cursor:default}
